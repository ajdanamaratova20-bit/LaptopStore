{% extends "shop/base.html" %}
{% load socialaccount %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h2>Вход</h2>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        {% if error %}<div class="alert alert-danger mte-3">{{ error }}</div>{% endif %}
        {% if google_enabled %}
        <div class="divider">или</div>
        <a href="{% provider_login_url 'google' %}" class="btn btn-outline-secondary w-100"><i class="bi bi-google me-2"></i>Войти через Google</a>
        {% endif %}
        <p class="text-center mt-3 mb-0">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
