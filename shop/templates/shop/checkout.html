{% extends "shop/base.html" %}
{% block title %}Оформление заказа{% endblock %}
{% block content %}
    <h1 class="mb-4">Оформление заказа</h1>
    <div class="row g-4">
        <div class="col-md-7">
            <form method="post" class="filter-card">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Адрес доставки</label>
                    <input type="text" name="address" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input type="text" name="phone" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Примечания</label>
                    <textarea name="notes" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Подтвердить заказ</button>
            </form>
        </div>
        <div class="col-md-5">
            <div class="summary-box">
                <h5 class="mb-3">Ваш заказ</h5>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-muted">Сумма к оплате</span>
                    <span class="total">${{ cart.get_total_price }}</span>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
